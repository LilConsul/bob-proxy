[project]
name = "bob-proxy"
version = "1.0.0"
description = "Local HMAC-signing proxy for Bob's LiteLLM backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx",
    "fastapi",
    "uvicorn",
    "h11",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator (often less readable)
]

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["proxy"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
